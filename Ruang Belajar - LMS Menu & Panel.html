<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruang Belajar - LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f9;--surface:#fff;--ink:#16213a;--muted:#5d6985;--line:#dfe4ee;
  --brand:#2150c8;--brand-ink:#fff;--brand-soft:#e6edff;--head:#14234d;
  --materi:#2150c8;--tugas:#c2410c;--video:#7c3aed;--kuis:#0f8a6e;--info:#a16207;
  --shadow:0 1px 2px rgba(20,35,77,.06),0 6px 18px rgba(20,35,77,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1424;--surface:#161e34;--ink:#e8ecf7;--muted:#9aa6c3;--line:#26304d;
  --brand:#6b93ff;--brand-ink:#0b1226;--brand-soft:#1d2a52;--head:#0a1020;
  --materi:#7aa2ff;--tugas:#fb923c;--video:#b794f6;--kuis:#34d399;--info:#facc15;
  --shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{
  --bg:#0e1424;--surface:#161e34;--ink:#e8ecf7;--muted:#9aa6c3;--line:#26304d;
  --brand:#6b93ff;--brand-ink:#0b1226;--brand-soft:#1d2a52;--head:#0a1020;
  --materi:#7aa2ff;--tugas:#fb923c;--video:#b794f6;--kuis:#34d399;--info:#facc15;
  --shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{background:var(--head);color:#fff}
.top-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.logo{width:36px;height:36px;border-radius:9px;background:#fff;color:#14234d;display:grid;place-items:center;font-weight:800}
.brand{font-weight:700;font-size:16px}
.brand small{display:block;font-weight:400;opacity:.7;font-size:12px}
.sp{flex:1}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;width:36px;height:36px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.avatar{width:36px;height:36px;border-radius:50%;background:#e6edff;color:#14234d;display:grid;place-items:center;font-weight:700;font-size:13px}
.course{max-width:1180px;margin:0 auto;padding:26px 24px 0;color:#fff}
.course h1{margin:0 0 4px;font-size:26px;letter-spacing:-.01em}
.course p{margin:0;opacity:.75;font-size:14px}
.hero{background:var(--head)}
.stats{display:flex;gap:22px;margin-top:14px;font-size:13px;opacity:.9;flex-wrap:wrap}
.stats b{font-size:15px}
.menubar{background:var(--head);}
.menubar-in{max-width:1180px;margin:0 auto;padding:18px 24px 0;display:flex;align-items:flex-end;gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;flex:0 1 auto;min-width:0}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:11px 18px;border:0;background:transparent;color:#c9d4f5;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.08)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab .cnt{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.14)}
.tab[aria-selected="true"] .cnt{background:var(--brand-soft);color:var(--brand)}
.add-tab{flex:none;margin-bottom:6px;display:flex;align-items:center;gap:6px;border:1px dashed rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.add-tab:hover{background:rgba(255,255,255,.1)}
main{max-width:1180px;margin:0 auto;padding:24px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.bar h2{margin:0;font-size:20px;letter-spacing:-.01em}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#c0392b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;border-top:4px solid var(--c)}
.panel[data-t="Materi"]{--c:var(--materi)}.panel[data-t="Tugas"]{--c:var(--tugas)}
.panel[data-t="Video"]{--c:var(--video)}.panel[data-t="Kuis"]{--c:var(--kuis)}.panel[data-t="Info"]{--c:var(--info)}
.p-head{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.badge{font-size:12px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:6px}
.badge svg{width:16px;height:16px}
.p-act{margin-left:auto;display:flex;gap:2px}
.p-act button{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:7px;cursor:pointer;display:grid;place-items:center}
.p-act button:hover{background:var(--bg);color:var(--ink)}
.p-body{padding:8px 16px 16px;flex:1}
.p-body h3{margin:4px 0 6px;font-size:16px;line-height:1.35}
.p-body p{margin:0;color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.p-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:48px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty h3{margin:0 0 6px;color:var(--ink)}
.empty .btn{margin-top:14px}
dialog{border:0;border-radius:14px;padding:0;width:min(480px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,32,.55)}
.d-in{padding:22px}
.d-in h3{margin:0 0 16px;font-size:18px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.f{margin-bottom:14px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px}
textarea{min-height:100px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.d-act{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--head);color:#fff;padding:10px 12px 10px 16px;border-radius:10px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px;z-index:20}
.toast button{background:transparent;border:0;color:#9db8ff;font-weight:700;cursor:pointer}
.toast[hidden]{display:none}
@media (max-width:640px){.top-in,.course,.menubar-in,main{padding-left:16px;padding-right:16px}.course h1{font-size:22px}.row{grid-template-columns:1fr}.menubar-in{flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo">R</div>
  <div class="brand">Ruang Belajar<small>Learning Management System</small></div>
  <div class="sp"></div>
  <button class="icon-btn" id="theme" aria-label="Ganti tema" title="Ganti tema">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <div class="avatar" title="Pengajar">PG</div>
</div></header>

<div class="hero"><div class="course">
  <h1>Pengantar Manajemen Proyek</h1>
  <p>Kelas MP-101 · Semester Ganjil 2026/2027</p>
  <div class="stats"><span><b id="sMenu">0</b> menu</span><span><b id="sPanel">0</b> panel</span><span><b id="sTugas">0</b> tugas</span></div>
</div></div>

<nav class="menubar"><div class="menubar-in">
  <div class="tabs" id="tabs" role="tablist" aria-label="Menu kelas"></div>
  <button class="add-tab" id="addMenu"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Tambah menu</button>
</div></nav>

<main>
  <div class="bar">
    <h2 id="menuTitle"></h2>
    <div class="sp"></div>
    <button class="btn" id="renameMenu">Ubah nama</button>
    <button class="btn danger" id="delMenu">Hapus menu</button>
    <button class="btn primary" id="addPanel">+ Tambah panel</button>
  </div>
  <div id="content"></div>
</main>

<dialog id="dMenu"><form method="dialog" class="d-in" id="fMenu">
  <h3 id="dMenuT">Tambah menu</h3>
  <div class="f"><label for="mName">Nama menu</label><input id="mName" required maxlength="30" placeholder="Contoh: Diskusi"></div>
  <div class="d-act"><button type="button" class="btn" data-close>Batal</button><button class="btn primary" id="mSave">Simpan menu</button></div>
</form></dialog>

<dialog id="dPanel"><form method="dialog" class="d-in" id="fPanel">
  <h3 id="dPanelT">Tambah panel</h3>
  <div class="row">
    <div class="f"><label for="pType">Jenis</label>
      <select id="pType"><option>Materi</option><option>Tugas</option><option>Video</option><option>Kuis</option><option>Info</option></select></div>
    <div class="f"><label for="pDate">Tanggal (opsional)</label><input type="date" id="pDate"></div>
  </div>
  <div class="f"><label for="pTitle">Judul panel</label><input id="pTitle" required maxlength="80" placeholder="Contoh: Siklus hidup proyek"></div>
  <div class="f"><label for="pBody">Isi</label><textarea id="pBody" maxlength="600" placeholder="Tulis ringkasan, instruksi, atau tautan."></textarea></div>
  <div class="d-act"><button type="button" class="btn" data-close>Batal</button><button class="btn primary">Simpan panel</button></div>
</form></dialog>

<div class="toast" id="toast" hidden><span id="toastT"></span><button id="undo">Batalkan</button></div>

<script>
const ICON={
  Materi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  Tugas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 13l2 2 4-4"/></svg>',
  Video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>',
  Kuis:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>',
  Info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 20a2 2 0 0 0 4 0"/></svg>'
};
const EDIT='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
const TRASH='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='lms-menu-panel-v1';
const seed=()=>({active:null,menus:[
 {id:'m1',name:'Beranda',panels:[
  {id:uid(),type:'Info',title:'Selamat datang di kelas',body:'Mulai dari menu Materi, lalu kerjakan tugas sebelum batas waktu.',date:''},
  {id:uid(),type:'Info',title:'Jadwal tatap muka',body:'Setiap Selasa, pukul 09.00 WIB.',date:''}]},
 {id:'m2',name:'Materi',panels:[
  {id:uid(),type:'Materi',title:'Siklus hidup proyek',body:'Inisiasi, perencanaan, pelaksanaan, pemantauan, dan penutupan.',date:''},
  {id:uid(),type:'Video',title:'Video: Menyusun WBS',body:'Durasi 12 menit. Tonton sebelum pertemuan berikutnya.',date:''}]},
 {id:'m3',name:'Tugas',panels:[
  {id:uid(),type:'Tugas',title:'Tugas 1: Piagam proyek',body:'Susun piagam proyek satu halaman untuk studi kasus yang dibagikan.',date:''},
  {id:uid(),type:'Kuis',title:'Kuis singkat bab 1',body:'10 soal pilihan ganda, waktu 15 menit.',date:''}]}
]});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.menus)||!S.menus.length)S=seed();
if(!S.menus.find(m=>m.id===S.active))S.active=S.menus[0].id;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const cur=()=>S.menus.find(m=>m.id===S.active);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

function render(){
  const tabs=$('tabs');tabs.replaceChildren();
  S.menus.forEach(m=>{
    const b=el('button','tab');b.setAttribute('role','tab');b.setAttribute('aria-selected',m.id===S.active);
    b.append(el('span','',m.name),el('span','cnt',m.panels.length));
    b.onclick=()=>{S.active=m.id;save();render()};
    tabs.append(b);
  });
  const m=cur();$('menuTitle').textContent=m.name;
  $('delMenu').disabled=S.menus.length<2;$('delMenu').style.opacity=S.menus.length<2?.45:1;
  const c=$('content');c.replaceChildren();
  if(!m.panels.length){
    const e=el('div','empty');e.append(el('h3','','Menu ini belum punya panel'),el('div','','Tambahkan materi, tugas, video, kuis, atau pengumuman.'));
    const b=el('button','btn primary','+ Tambah panel');b.onclick=()=>openPanel();e.append(b);c.append(e);
  }else{
    const g=el('div','grid');
    m.panels.forEach(p=>{
      const a=el('article','panel');a.dataset.t=p.type;
      const h=el('div','p-head');const bd=el('span','badge');bd.innerHTML=ICON[p.type]||'';bd.append(p.type);
      const act=el('div','p-act');
      const eb=el('button');eb.innerHTML=EDIT;eb.title='Ubah panel';eb.setAttribute('aria-label','Ubah panel');eb.onclick=()=>openPanel(p);
      const db=el('button');db.innerHTML=TRASH;db.title='Hapus panel';db.setAttribute('aria-label','Hapus panel');db.onclick=()=>delPanel(p.id);
      act.append(eb,db);h.append(bd,act);
      const body=el('div','p-body');body.append(el('h3','',p.title));if(p.body)body.append(el('p','',p.body));
      a.append(h,body);
      if(p.date){const f=el('div','p-foot','Tenggat/jadwal: '+new Date(p.date+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}));a.append(f)}
      g.append(a);
    });
    c.append(g);
  }
  $('sMenu').textContent=S.menus.length;
  const all=S.menus.flatMap(x=>x.panels);
  $('sPanel').textContent=all.length;$('sTugas').textContent=all.filter(p=>p.type==='Tugas').length;
}

/* menu */
let menuEdit=null;
function openMenu(edit){
  menuEdit=edit?cur():null;
  $('dMenuT').textContent=edit?'Ubah nama menu':'Tambah menu';
  $('mName').value=edit?cur().name:'';
  $('dMenu').showModal();$('mName').focus();
}
$('addMenu').onclick=()=>openMenu(false);
$('renameMenu').onclick=()=>openMenu(true);
$('fMenu').addEventListener('submit',e=>{
  const n=$('mName').value.trim();if(!n)return;
  if(menuEdit)menuEdit.name=n;
  else{const m={id:uid(),name:n,panels:[]};S.menus.push(m);S.active=m.id}
  save();render();
  setTimeout(()=>{const t=document.querySelector('.tab[aria-selected="true"]');t&&t.scrollIntoView({inline:'center',block:'nearest'})},0);
});
$('delMenu').onclick=()=>{
  if(S.menus.length<2)return;
  const snap=JSON.stringify(S);const m=cur();
  S.menus=S.menus.filter(x=>x.id!==m.id);S.active=S.menus[0].id;save();render();
  toast('Menu "'+m.name+'" dihapus',()=>{S=JSON.parse(snap);save();render()});
};

/* panel */
let panelEdit=null;
function openPanel(p){
  panelEdit=p||null;
  $('dPanelT').textContent=p?'Ubah panel':'Tambah panel';
  $('pType').value=p?p.type:'Materi';$('pTitle').value=p?p.title:'';
  $('pBody').value=p?p.body:'';$('pDate').value=p?p.date:'';
  $('dPanel').showModal();$('pTitle').focus();
}
$('addPanel').onclick=()=>openPanel();
$('fPanel').addEventListener('submit',e=>{
  const t=$('pTitle').value.trim();if(!t)return;
  const d={type:$('pType').value,title:t,body:$('pBody').value.trim(),date:$('pDate').value};
  if(panelEdit)Object.assign(panelEdit,d);else cur().panels.push({id:uid(),...d});
  save();render();
});
function delPanel(id){
  const snap=JSON.stringify(S);const m=cur();
  m.panels=m.panels.filter(p=>p.id!==id);save();render();
  toast('Panel dihapus',()=>{S=JSON.parse(snap);save();render()});
}

/* umum */
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
let tt,undoFn;
function toast(msg,fn){
  $('toastT').textContent=msg;undoFn=fn;$('toast').hidden=false;
  clearTimeout(tt);tt=setTimeout(()=>$('toast').hidden=true,6000);
}
$('undo').onclick=()=>{undoFn&&undoFn();$('toast').hidden=true};
$('theme').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};
render();
</script>
</body>
</html>
